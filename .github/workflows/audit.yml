name: Audit

# Checks the libraries the app creates against the published lists of known vulnerabilities.
# Also runs every Monday
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Actions are pinned to exact commits, since a tag can be moved to different code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false
      # Only what ends up in the app; the build tools are not shipped.
      - run: npm audit --omit=dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo install cargo-audit --locked
      # Fails on a known vulnerability; unmaintained crates are listed as warnings only.
      - run: cargo audit
        working-directory: src-tauri
