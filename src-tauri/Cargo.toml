[package]
name = "scan-insights-for-nessus"
version = "0.1.0"
description = "Scan Insights for Nessus - desktop .nessus file viewer"
authors = []
edition = "2021"

[lib]
name = "scan_insights_for_nessus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.7", features = [] }

[dependencies]
tauri             = { version = "~2.12", features = [] }
tauri-plugin-dialog = "~2.8"
open              = { version = "5", features = ["shellexecute-on-windows"] }
serde             = { version = "1", features = ["derive", "rc"] }
serde_json        = "1"
quick-xml         = "0.42"
uuid              = { version = "1", features = ["v4"] }
csv               = "1"
rust_xlsxwriter   = "0.102"
chrono            = { version = "0.4", features = ["serde"] }

[profile.dev]
incremental = true

[profile.release]
panic        = "abort"
codegen-units = 1
lto          = true
opt-level    = "s"
strip        = true
